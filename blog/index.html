<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog | 本谷元のはじめちゃんサイト</title>
    <meta name="description" content="本谷元のブログ記事一覧です。">
    <link rel="apple-touch-icon" href="https://hontani-hajime.github.io/file/icon.jpg">
    <link rel="icon" href="https://hontani-hajime.github.io/file/icon.jpg">
    <link rel="stylesheet" href="https://hontani-hajime.github.io/style.css">
</head>
<body>
    <main class="main-content">
        <section class="blog-section" style="margin-top: 60px;">
            <h2 class="section-title"><span class="marker-static marker-green">Blog</span></h2>
            
            <div style="max-width: 1000px; margin: 0 auto;">
                <div class="blog-filter-wrapper">
                    <div class="blog-filter-tags" id="blog-filter-tags">
                    </div>
                    <div class="blog-search-box">
                        <input type="text" id="blog-search-input" placeholder="タイトルで検索...">
                    </div>
                </div>

                <div class="blog-grid-container" id="blog-page-list">
                </div>
            </div>

            <div class="blog-btn-wrapper" style="margin-top: 50px;">
                <a href="https://hontani-hajime.github.io/" class="action-btn">
                    トップページへ戻る
                    <span class="btn-arrow-circle">
                        <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg>
                    </span>
                </a>
            </div>
        </section>
    </main>
    <script src="https://hontani-hajime.github.io/script.js"></script>
</body>
</html>
