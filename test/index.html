<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog & Photos デザイン案 | 本谷元のはじめちゃんサイト</title>
    <style>
        /* =========================================
           ベースとなる共通スタイル（元のサイトの世界観）
           ========================================= */
        body {
            background-color: #ffffff;
            color: #333333;
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
            line-height: 1.6;
            padding: 40px 20px;
            background-image: radial-gradient(#eee 2px, transparent 2px);
            background-size: 30px 30px; /* 背景を少しドット柄にしてポップに */
        }
        h2 {
            text-align: center;
            font-size: 28px;
            letter-spacing: 0.1em;
            margin: 60px 0 30px;
            text-shadow: 2px 2px 0px #ccc;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 40px;
            margin-bottom: 40px;
        }

        /* 共通のタグスタイル */
        .tag {
            font-size: 11px;
            padding: 4px 12px;
            border-radius: 15px;
            font-weight: bold;
            border: 2px solid #333;
            background-color: #fff;
            color: #333;
            box-shadow: 2px 2px 0px var(--tag-color, #333);
            display: inline-block;
        }
        .tag-webit { --tag-color: #20c997; }
        .tag-photo { --tag-color: #fd7e14; }
        .tag-study { --tag-color: #6f42c1; }

        a { text-decoration: none; color: inherit; display: block; }

        /* =========================================
           BLOG 1: スクラップブック風（マスキングテープ）
           ========================================= */
        .bp-a-card {
            border: 2px solid #333;
            border-radius: 12px;
            background-color: #fff;
            padding: 15px;
            box-shadow: 6px 6px 0px #333;
            position: relative;
            transform: rotate(-2deg);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        /* マスキングテープのあしらい */
        .bp-a-card::before {
            content: "";
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%) rotate(4deg);
            width: 80px;
            height: 25px;
            background-color: rgba(32, 201, 151, 0.7); /* グリーンの半透明 */
            border: 1px dashed #333;
            box-shadow: 2px 2px 0px #333;
            z-index: 10;
        }
        .bp-a-card:hover {
            transform: rotate(0deg) translate(4px, 4px);
            box-shadow: 0px 0px 0px #333;
        }
        .bp-a-img {
            width: 100%;
            aspect-ratio: 16 / 9;
            border: 2px solid #333;
            border-radius: 8px;
            object-fit: cover;
            margin-bottom: 15px;
        }
        .bp-a-title { font-size: 18px; font-weight: bold; margin-bottom: 8px; line-height: 1.4; }
        .bp-a-date { font-size: 13px; color: #666; font-weight: bold; margin-bottom: 10px; display: block; }

        /* =========================================
           BLOG 2: ぽってりブロック風（角丸強調＆ズーム）
           ========================================= */
        .bp-b-card {
            border: 3px solid #333; /* 少し太め */
            border-radius: 32px; /* 角丸をかなり大きく */
            background-color: #fff;
            padding: 20px;
            box-shadow: 5px 5px 0px #333;
            transition: all 0.2s ease;
            transform: translate(-3px, -3px);
            overflow: hidden;
        }
        .bp-b-card:hover {
            transform: translate(0, 0);
            box-shadow: 0px 0px 0px #333;
        }
        .bp-b-img-wrap {
            width: 100%;
            aspect-ratio: 16 / 9;
            border: 2px solid #333;
            border-radius: 20px;
            overflow: hidden;
            margin-bottom: 15px;
        }
        .bp-b-img-wrap img {
            width: 100%; height: 100%; object-fit: cover;
            transition: transform 0.5s ease;
        }
        .bp-b-card:hover .bp-b-img-wrap img {
            transform: scale(1.1); /* ホバーで画像だけズーム */
        }
        .bp-b-title { font-size: 18px; font-weight: bold; margin-bottom: 10px; }
        .bp-b-date { font-size: 13px; color: #e83e8c; font-weight: bold; margin-bottom: 10px; display: block; }

        /* =========================================
           BLOG 3: チケット風（横長・切り欠き）
           ========================================= */
        .bp-c-card {
            display: flex;
            align-items: center;
            border: 2px solid #333;
            background-color: #fff;
            padding: 15px;
            box-shadow: 4px 4px 0px #333;
            position: relative;
            transition: all 0.2s ease;
            transform: translate(-2px, -2px);
            margin-bottom: 20px;
        }
        /* 左の切り欠き */
        .bp-c-card::before {
            content: ""; position: absolute; left: -10px; top: 50%; transform: translateY(-50%);
            width: 16px; height: 32px;
            background-color: #eee; /* 背景色に合わせる */
            border: 2px solid #333;
            border-left: none;
            border-radius: 0 32px 32px 0;
        }
        /* 右の切り欠き */
        .bp-c-card::after {
            content: ""; position: absolute; right: -10px; top: 50%; transform: translateY(-50%);
            width: 16px; height: 32px;
            background-color: #eee;
            border: 2px solid #333;
            border-right: none;
            border-radius: 32px 0 0 32px;
        }
        .bp-c-card:hover {
            transform: translate(0, 0);
            box-shadow: 0px 0px 0px #333;
        }
        .bp-c-img {
            width: 100px; height: 100px;
            border: 2px solid #333;
            border-radius: 50%; /* 画像をまん丸に */
            object-fit: cover;
            margin-right: 20px;
            flex-shrink: 0;
            margin-left: 15px;
        }
        .bp-c-info { flex: 1; margin-right: 15px; }
        .bp-c-title { font-size: 18px; font-weight: bold; margin-bottom: 8px; }
        .bp-c-date { font-size: 13px; color: #666; font-weight: bold; margin-bottom: 8px; display: block; }


        /* =========================================
           PHOTOS 1: ピン留め風（上部画鋲＋揺れアニメ）
           ========================================= */
        .pp-a-card {
            background-color: #fff;
            padding: 12px;
            border: 2px solid #333;
            border-radius: 4px;
            box-shadow: 6px 6px 0px #333;
            position: relative;
            transform-origin: top center; /* 揺れの支点を上部中央に */
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        /* ピンのあしらい */
        .pp-a-card::before {
            content: "";
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 16px; height: 16px;
            background-color: #e83e8c; /* ピンクのピン */
            border: 2px solid #333;
            border-radius: 50%;
            box-shadow: 2px 2px 0px #333;
            z-index: 10;
        }
        .pp-a-card:hover {
            animation: swing 0.6s ease-in-out infinite alternate; /* ブランコのように揺れる */
            box-shadow: 8px 12px 0px rgba(0,0,0,0.2); /* 浮いた感じの影に */
            z-index: 20;
        }
        @keyframes swing {
            0% { transform: rotate(-3deg); }
            100% { transform: rotate(3deg); }
        }
        .pp-a-img { width: 100%; aspect-ratio: 4/3; object-fit: cover; border: 2px solid #333; }

        /* =========================================
           PHOTOS 2: チェキ風（下部余白）
           ========================================= */
        .pp-b-card {
            background-color: #fdfdfd;
            padding: 15px 15px 45px 15px; /* 下だけ余白を大きく */
            border: 2px solid #333;
            box-shadow: 4px 4px 0px #333;
            position: relative;
            transform: rotate(2deg) translate(-2px, -2px);
            transition: all 0.2s ease;
        }
        .pp-b-card:hover {
            transform: rotate(0deg) translate(0, 0);
            box-shadow: 0px 0px 0px #333;
            z-index: 20;
        }
        .pp-b-img { width: 100%; aspect-ratio: 1/1; object-fit: cover; border: 2px solid #333; }
        .pp-b-text {
            position: absolute;
            bottom: 12px;
            left: 0; width: 100%;
            text-align: center;
            font-size: 16px;
            font-family: "Marker Felt", "Comic Sans MS", fantasy, sans-serif; /* 手書き風フォントを想定 */
            color: #333;
            font-weight: bold;
        }

        /* =========================================
           PHOTOS 3: ダイカットステッカー風（いびつな形）
           ========================================= */
        .pp-c-card {
            display: block;
            border: 4px solid #fff; /* ステッカーの白フチ */
            outline: 2px solid #333; /* ステッカーの黒フチ */
            /* わざと少し歪な角丸にする */
            border-radius: 255px 15px 225px 15px / 15px 225px 15px 255px; 
            overflow: hidden;
            box-shadow: 4px 4px 0px #333;
            transform: translate(-4px, -4px);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); /* ぷるんと戻る動き */
        }
        .pp-c-card:hover {
            transform: translate(0, 0) scale(1.03) rotate(-2deg);
            box-shadow: 0px 0px 0px #333;
            outline: 3px solid #333;
            z-index: 20;
        }
        .pp-c-img { width: 100%; aspect-ratio: 4/3; object-fit: cover; display: block; }
        
    </style>
</head>
<body>

<div class="container">

    <h2>📝 Blog デザイン案</h2>

    <div class="grid">
        <!-- Blog パターンA -->
        <a href="#" class="bp-a-card">
            <img src="https://hontani-hajime.github.io/file/noimage.jpg" class="bp-a-img" alt="Blog Image">
            <span class="bp-a-date">2026.08.20</span>
            <h3 class="bp-a-title">【Pattern A】 スクラップブック＆マスキングテープ風</h3>
            <div>
                <span class="tag tag-webit">WEB・IT</span>
                <span class="tag tag-study">勉強</span>
            </div>
        </a>

        <!-- Blog パターンB -->
        <a href="#" class="bp-b-card">
            <div class="bp-b-img-wrap">
                <img src="https://hontani-hajime.github.io/file/noimage.jpg" alt="Blog Image">
            </div>
            <span class="bp-b-date">2026.08.20</span>
            <h3 class="bp-b-title">【Pattern B】 ぽってりブロック＆ホバーでズーム</h3>
            <div>
                <span class="tag tag-webit">WEB・IT</span>
            </div>
        </a>
    </div>

    <!-- Blog パターンC (横長なのでグリッドから外す) -->
    <a href="#" class="bp-c-card">
        <img src="https://hontani-hajime.github.io/file/noimage.jpg" class="bp-c-img" alt="Blog Image">
        <div class="bp-c-info">
            <span class="bp-c-date">2026.08.20</span>
            <h3 class="bp-c-title">【Pattern C】 チケット風の横長デザイン</h3>
            <div>
                <span class="tag tag-study">勉強</span>
                <span class="tag tag-webit">WEB・IT</span>
            </div>
        </div>
    </a>


    <h2 style="margin-top: 100px;">📷 Photos デザイン案</h2>

    <div class="grid">
        <!-- Photos パターンA -->
        <a href="#" class="pp-a-card">
            <img src="https://hontani-hajime.github.io/file/01.jpg" onerror="this.src='https://hontani-hajime.github.io/file/noimage.jpg'" class="pp-a-img" alt="Photo">
        </a>

        <!-- Photos パターンB -->
        <a href="#" class="pp-b-card">
            <img src="https://hontani-hajime.github.io/file/02.jpg" onerror="this.src='https://hontani-hajime.github.io/file/noimage.jpg'" class="pp-b-img" alt="Photo">
            <div class="pp-b-text">Photo 1</div>
        </a>

        <!-- Photos パターンC -->
        <a href="#" class="pp-c-card">
            <img src="https://hontani-hajime.github.io/file/03.jpg" onerror="this.src='https://hontani-hajime.github.io/file/noimage.jpg'" class="pp-c-img" alt="Photo">
        </a>
    </div>

</div>

</body>
</html>
