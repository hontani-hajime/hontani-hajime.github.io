<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>ページが見つかりません | 本谷元のはじめちゃんサイト</title>
    <link rel="icon" href="https://hontani-hajime.github.io/file/icon.jpg">
    <link rel="stylesheet" href="https://hontani-hajime.github.io/style.css">
</head>
<body>
    <main class="main-content" style="display: flex; flex-direction: column; min-height: 80vh; justify-content: center;">
        <section style="text-align: center; margin: 60px 20px 40px; flex-grow: 1; display: flex; flex-direction: column; justify-content: center; align-items: center;">
            <h1 class="font-bold" style="font-size: 80px; color: #333; margin-bottom: 20px; letter-spacing: 0.1em;">404</h1>
            <p style="font-size: 16px; margin-bottom: 40px; color: #555; line-height: 1.8;">
                お探しのページは見つかりませんでした。<br>URLが間違っているか、ページが移動した可能性があります。
            </p>
            <a href="https://hontani-hajime.github.io/" class="action-btn">
                トップページへ戻る
                <span class="btn-arrow-circle">
                    <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg>
                </span>
            </a>
        </section>
        <div class="wave-scene dir-right" style="margin: 0 0 40px 0;">
            <div class="scene-sky">
                <svg viewBox="0 0 120 120" width="140" height="140" style="position:absolute; left: 10%; bottom: 0;">
                    <polygon points="0,120 40,30 80,120" fill="#f0f0f0"/>
                    <polygon points="40,120 80,10 120,120" fill="#e0e0e0"/>
                </svg>
                <svg viewBox="0 0 120 120" width="130" height="130" style="position:absolute; right: 15%; bottom: 0;">
                    <rect x="10" y="50" width="30" height="70" fill="#e0e0e0"/>
                    <rect x="40" y="20" width="35" height="100" fill="#f0f0f0"/>
                    <rect x="75" y="60" width="30" height="60" fill="#e8e8e8"/>
                    <rect x="45" y="30" width="10" height="10" fill="#fff"/>
                    <rect x="60" y="30" width="10" height="10" fill="#fff"/>
                    <rect x="45" y="50" width="10" height="10" fill="#fff"/>
                    <rect x="60" y="50" width="10" height="10" fill="#fff"/>
                </svg>
                <svg viewBox="0 0 100 100" width="90" height="90" style="position:absolute; left: 50%; bottom: 0; transform: translateX(-50%);">
                    <polygon points="35,100 65,100 60,30 40,30" fill="#f5f5f5"/>
                    <polygon points="38,80 62,80 61,65 39,65" fill="#e0e0e0"/>
                    <polygon points="39,45 61,45 60,30 40,30" fill="#e0e0e0"/>
                    <rect x="35" y="25" width="30" height="5" fill="#333"/>
                    <rect x="42" y="10" width="16" height="15" fill="#fff" stroke="#333" stroke-width="2"/>
                    <polygon points="30,10 50,0 70,10" fill="#333"/>
                </svg>
            </div>
            <div class="scene-sky-obj ufo">
                <svg viewBox="0 0 100 100" width="60" height="60">
                    <path d="M25,50 C25,20 75,20 75,50 Z" fill="#333"/>
                    <ellipse cx="50" cy="50" rx="45" ry="12" fill="#333"/>
                    <ellipse cx="30" cy="58" rx="8" ry="10" fill="#333"/>
                    <ellipse cx="50" cy="62" rx="10" ry="12" fill="#333"/>
                    <ellipse cx="70" cy="58" rx="8" ry="10" fill="#333"/>
                    <circle cx="35" cy="40" r="4" fill="#fff"/>
                    <circle cx="50" cy="38" r="5" fill="#fff"/>
                    <circle cx="65" cy="40" r="4" fill="#fff"/>
                </svg>
            </div>
            <div class="wave-sea"></div>
        </div>
    </main>
    <script src="https://hontani-hajime.github.io/script.js"></script>
</body>
</html>
