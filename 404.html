<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Not Found | 本谷元のはじめちゃんサイト</title>
    
    <!-- 404ページは検索エンジンにインデックスさせない -->
    <meta name="robots" content="noindex, nofollow">
    
    <!-- アイコン関係は絶対パス -->
    <link rel="apple-touch-icon" href="https://hontani-hajime.github.io/file/icon.jpg">
    <link rel="icon" href="https://hontani-hajime.github.io/file/icon.jpg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&display=swap" rel="stylesheet">

    <!-- トップページと同じCSSを読み込む -->
    <link rel="stylesheet" href="https://hontani-hajime.github.io/style.css">
    
    <!-- 404ページ専用のレイアウト調整 (style.cssを汚さずHTML内で完結させます) -->
    <style>
        .not-found-container {
            text-align: center;
            padding: 80px 20px;
            min-height: 50vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .not-found-code {
            font-size: 100px;
            font-family: sans-serif;
            font-weight: bold;
            color: #333;
            line-height: 1;
            margin-bottom: 20px;
            text-shadow: 6px 6px 0px rgba(51, 51, 51, 0.1);
        }
        .not-found-message {
            font-size: 16px;
            line-height: 2;
            color: #444;
            margin-bottom: 40px;
        }
        .not-found-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 2px solid #333;
            margin-bottom: 30px;
            object-fit: cover;
        }
        @media (max-width: 768px) {
            .not-found-code { font-size: 80px; }
            .not-found-container { padding: 40px 20px; }
        }
    </style>
</head>
<body>
    <div class="top-line"></div>

    <header class="site-header">
        <div class="header-inner">
            <div class="logo-area">
                <a href="https://hontani-hajime.github.io/">
                    <img src="https://hontani-hajime.github.io/file/icon.jpg" alt="アイコン" class="site-logo">
                </a>
                <div class="site-titles">
                    <a href="https://hontani-hajime.github.io/" style="text-decoration: none; color: inherit;">
                        <h1 class="main-title klee-one-semibold">本谷元のはじめちゃんサイト</h1>
                    </a>
                    <p class="sub-title klee-one-regular">Hajime Hontani's Hajime-chan Site</p>
                </div>
            </div>

            <div class="hamburger" id="hamburger">
                <span></span>
                <span></span>
            </div>

            <nav class="global-nav" id="global-nav">
                <ul>
                    <li><a href="https://hontani-hajime.github.io/profile/" class="klee-one-regular">Profile</a></li>
                    <li><a href="https://hontani-hajime.github.io/blog/" class="klee-one-regular">Blog</a></li>
                    <li><a href="https://hontani-hajime.github.io/photos/" class="klee-one-regular">Photos</a></li>
                    <li><a href="https://hontani-hajime.github.io/web-works/" class="klee-one-regular">Web Works</a></li>
                    
                    <li class="sns-list">
                        <a href="https://www.instagram.com/hajimechandayon" target="_blank" rel="noopener noreferrer" class="sns-link">
                            <div class="sns-circle">
                                <img src="https://hontani-hajime.github.io/file/instagram.jpg" alt="Instagram" class="sns-icon">
                            </div>
                        </a>
                        <a href="https://www.linkedin.com/in/hontani-hajime/" target="_blank" rel="noopener noreferrer" class="sns-link">
                            <div class="sns-circle">
                                <img src="https://hontani-hajime.github.io/file/linkedIn.jpg" alt="LinkedIn" class="sns-icon">
                            </div>
                        </a>
                        <a href="https://jp.pinterest.com/hontanihajime/" target="_blank" rel="noopener noreferrer" class="sns-link">
                            <div class="sns-circle">
                                <img src="https://hontani-hajime.github.io/file/pinterest.jpg" alt="Pinterest" class="sns-icon">
                            </div>
                        </a>
                    </li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="main-content">
        <div class="not-found-container">
            <!-- ちょっと困った感じを出すためにアイコンを表示 -->
            <img src="https://hontani-hajime.github.io/file/icon.jpg" alt="アイコン" class="not-found-img">
            
            <div class="not-found-code">404</div>
            <h2 class="section-title klee-one-semibold" style="margin: 0 auto 30px;">Not Found</h2>
            
            <p class="not-found-message klee-one-regular">
                ごめんなさい！<br>
                お探しのページは移動または削除されたか、<br>
                URLが間違っているみたいです。
            </p>
            
            <!-- トップに戻るボタン -->
            <a href="https://hontani-hajime.github.io/" class="profile-btn klee-one-semibold">トップページへ戻る</a>
        </div>
    </main>

    <!-- ▼ 修正済みのフッター ▼ -->
    <footer class="site-footer">
        <div class="footer-inner">
            <a href="https://hontani-hajime.github.io/" class="footer-logo-link">
                <img src="https://hontani-hajime.github.io/file/icon.jpg" alt="アイコン" class="footer-logo">
                <span class="klee-one-semibold">本谷元のはじめちゃんサイト</span>
            </a>
            
            <ul class="footer-links klee-one-regular">
                <li><a href="https://hontani-hajime.github.io/site-policy/">サイトポリシー</a></li>
                <li><a href="https://hontani-hajime.github.io/privacy-policy/">プライバシーポリシー</a></li>
            </ul>
            
            <p class="copyright klee-one-regular">&copy; 2026 Hontani Hajime.</p>
        </div>
    </footer>

    <!-- ハンバーガーメニュー動作用にトップと同じJSを読み込む -->
    <script src="https://hontani-hajime.github.io/script.js"></script>
</body>
</html>
